[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calib-observability"
version = "0.1.0"
description = "Observability analysis for online IMU-LiDAR spatial and temporal calibration."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ivan Kakurin" }]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
    "nbconvert",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
